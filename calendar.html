<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排期日历 · 已并入策划台</title>
<!-- 老地址还能用：日历现在长在策划台里，进来直接是日历视图 -->
<meta http-equiv="refresh" content="0; url=cards.html#cal">
<script>location.replace('cards.html#cal');</script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f0eeec;
    color: #16140f;
    font: 14px/1.6 "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .go {
    max-width: 360px;
    padding: 22px 24px;
    border: 1px solid #e6e3de;
    border-radius: 18px;
    background: #fff;
    text-align: center;
  }
  .go b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
  .go p { margin: 8px 0 0; font-size: 13px; color: #6d675f; }
  .go a {
    display: inline-block;
    margin-top: 16px;
    padding: 9px 18px;
    border-radius: 10px;
    background: #14140f;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101012; color: #f2efea; }
    .go { border-color: #2c2c31; background: #1a1a1d; }
    .go p { color: #a8a29a; }
    .go a { background: #f4f1ec; color: #15150f; }
  }
</style>
</head>
<body>
  <div class="go">
    <b>日历搬到策划台里了</b>
    <p>清单和日历现在是同一个页面的两个看法，数据还是那一份。</p>
    <a href="cards.html#cal">没跳过去？点这里</a>
  </div>
</body>
</html>
