<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0eeec">
<title>策划台</title>
<link rel="stylesheet" href="assets/desk.css?v=1118w">
<link rel="stylesheet" href="assets/cards.css?v=1125a">
<link rel="stylesheet" href="assets/planner.css?v=1125b">
<link rel="stylesheet" href="assets/calendar.css?v=1131a">
<link rel="stylesheet" href="assets/planner-view.css?v=1131a">
</head>
<body class="cd-page">

<div class="cd-bg" aria-hidden="true"><canvas></canvas></div>

<header class="cd-bar">
  <b class="cd-title">策划台</b>
  <div class="grow"></div>
  <button class="dk-cloud" id="btnSync" type="button" title="同步：手机上打开就是同一份">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.4 18.4h9.9a3.6 3.6 0 0 0 .5-7.2 5.3 5.3 0 0 0-10.2-1.5 4.1 4.1 0 0 0-.2 8.7z"/>
    </svg>
    <i>只在本机</i>
  </button>
  <button class="cd-btn" id="btnTheme" type="button" title="深浅色" aria-label="切换深浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/>
    </svg>
  </button>
  <button class="cd-btn" id="btnTrash" type="button" title="回收站：删掉的卡片能捡回来" aria-label="回收站">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 6.8h15M9.4 6.8V5.2a1.4 1.4 0 0 1 1.4-1.4h2.4a1.4 1.4 0 0 1 1.4 1.4v1.6"/>
      <path d="M6.4 6.8 7.3 19a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.9-12.2"/>
    </svg>
    <i id="trashN"></i>
  </button>
  <button class="lf-add" type="button" id="plAddTop" title="加一条计划">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>
    加一条
  </button>
</header>

<main class="lf-main">

  <!-- 月份就是标题 -->
  <div class="lf-hd">
    <h1 class="lf-h1"><b id="plYm">11 月</b><em id="plYr">2026</em></h1>
    <div class="lf-mnav" role="group" aria-label="切换月份">
      <button class="lf-mb" id="plPrev" type="button" title="上个月" aria-label="上个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <label class="lf-mb lf-pick" title="直接选月份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.4" y="5.4" width="17.2" height="15.2" rx="2.6"/>
          <path d="M8 3.4v3.6M16 3.4v3.6M3.4 10.2h17.2"/>
        </svg>
        <input class="pl-pick" id="plPick" type="month" aria-label="选择月份">
      </label>
      <button class="lf-mb" id="plNext" type="button" title="下个月" aria-label="下个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </button>
      <button class="lf-mb is-today" id="plToday" type="button" title="回到本月">今</button>
    </div>

    <!-- 清单 / 日历：同一份数据，两个看法 -->
    <div class="pv-switch" role="tablist" aria-label="切换视图">
      <button class="pv-sw is-on" type="button" data-view="list" role="tab" aria-selected="true">清单</button>
      <button class="pv-sw" type="button" data-view="cal" role="tab" aria-selected="false">日历</button>
    </div>

    <div class="grow"></div>
    <p class="lf-hnote" id="plNowSub"></p>
  </div>

  <!-- ============ 清单视图：原有内容，一行没动 ============ -->
  <div id="plListView" class="pv-body">

  <!-- 一排：六个账号各自交到什么程度 + 一个总完成率 -->
  <section class="lf-kpi" id="plTiles" aria-label="各账号进度"></section>

  <!-- 一排：四个阶段，点一下只看那一档 -->
  <section class="lf-pipe" id="plBars" aria-label="阶段分布"></section>

  <div class="lf-grid">

    <!-- 左：这个月的计划 -->
    <section class="lf-card lf-listcard" aria-label="这个月的计划">
      <div class="lf-ch">
        <b>这个月的计划</b>
        <span class="lf-ch-n" id="plSumSub"></span>
        <div class="grow"></div>
        <button class="lf-x" type="button" id="plClear" title="取消筛选" aria-label="取消筛选" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.4 6.4l11.2 11.2M17.6 6.4 6.4 17.6"/></svg>
        </button>
      </div>
      <div class="lf-bar" aria-hidden="true"><i id="plTrackFill"></i></div>
      <div class="lf-rows" id="plRows"></div>

      <!-- 加一条：平时收成一行 -->
      <section class="lf-new" id="plNew">
        <button class="lf-new-tog" type="button" id="plNewTog" aria-expanded="false" aria-controls="plForm">
          <svg class="lf-new-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.6v12.8M5.6 12h12.8"/></svg>
          加一条
        </button>

        <form id="plForm" autocomplete="off">
          <label class="lf-f">
            <i>名称</i>
            <input class="lf-in" id="fName" type="text" placeholder="iPhone Duo 退货那条口播" spellcheck="false">
          </label>
          <div class="lf-f2">
            <label class="lf-f">
              <i>账号</i>
              <select class="lf-in" id="fAcct"></select>
            </label>
            <label class="lf-f">
              <i>截止</i>
              <input class="lf-in" id="fDue" type="date">
            </label>
          </div>
          <label class="lf-f">
            <i>备注</i>
            <input class="lf-in" id="fNote" type="text" placeholder="可不填" spellcheck="false">
          </label>
          <label class="lf-f">
            <i>进度</i>
            <select class="lf-in" id="fSt">
              <option value="todo">未开始</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </label>
          <button class="lf-submit" type="submit" id="plAdd">加进去</button>
        </form>
      </section>
    </section>

    <!-- 右：SOP 卡片 -->
    <section class="lf-card lf-cardspane" aria-label="SOP 卡片">
      <div class="cd-main" id="cardPane">

        <aside class="cd-tree" id="cdTreeWrap">
          <div class="cd-find">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.6"/><path d="M16.2 16.2 20 20"/>
            </svg>
            <input id="cdFind" type="text" placeholder="找一张卡" autocomplete="off" spellcheck="false">
            <button class="cd-find-x" type="button" id="cdFindX" title="清掉">✕</button>
          </div>
          <div class="cd-tree-body" id="cdTree"></div>
          <div class="cd-tree-foot" id="cdSum"></div>
        </aside>

        <section class="cd-pane" id="cdPane"></section>

      </div>
    </section>

  </div>

  </div>

  <!-- ============ 日历视图：同一份计划按天铺开，点一条回清单改 ============ -->
  <div id="plCalView" class="pv-body" hidden>
    <div class="cl-page cl-embed">
      <div class="cl-wrap">

        <!-- 数字 + 当天清单（原来日历页那张卡车图没搬进来：策划台是干活的界面，
             一张图要占 400-500px，第一屏就看不到月历了） -->
        <section class="cl-hero">
          <div class="cl-stage">
            <div class="cl-kpis" id="kpis"></div>

            <aside class="cl-day" id="dayPane">
              <div class="cl-day-h"><b id="dayTitle"></b></div>
              <div class="cl-day-b" id="dayBody"></div>
              <div class="cl-day-f"><i id="daySum"></i><a href="cards.html" data-add="1">+ 加一条</a></div>
            </aside>
          </div>
        </section>

        <!-- 接下来几天 -->
        <section class="cl-strip" id="strip"></section>

        <!-- 账号 + 月历 -->
        <section class="cl-board">
          <aside class="cl-who">
            <div class="cl-wh-h"><b>账号</b><i id="whoSum"></i></div>
            <div id="whoList"></div>
            <div class="cl-wh-f"><span>没排日期</span><i id="noDue">0</i></div>
          </aside>
          <div class="cl-cal">
            <div class="cl-dow"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
            <div class="cl-grid" id="grid"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

</main>

<aside class="cd-drawer" id="drawer">
  <div class="cd-dw-hd">
    <b>回收站</b>
    <button class="cd-dw-x" type="button" id="dwClose" title="关上">✕</button>
  </div>
  <div class="cd-dw-list" id="dwList"></div>
  <div class="cd-dw-ft">
    <button class="cd-btn is-danger" type="button" id="dwEmpty">清空</button>
  </div>
</aside>

<div class="nt-bar" id="noteBar" hidden>
  <button type="button" data-nt2="b" title="加粗（Ctrl+B）"><b>B</b></button>
  <span class="nt-bar-hr"></span>
  <button type="button" class="nt-fg" data-nt2="fg:d" title="恢复默认颜色"><span>A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:r" title="红色"><span style="color:var(--fg-red)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:o" title="橙色"><span style="color:var(--fg-orange)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:g" title="绿色"><span style="color:var(--fg-green)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:b" title="蓝色"><span style="color:var(--fg-blue)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:p" title="紫色"><span style="color:var(--fg-purple)">A</span></button>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="hl:255,232,120" title="黄色荧光笔"><i style="background:#ffe878"></i></button>
  <button type="button" data-nt2="hl:178,240,190" title="绿色荧光笔"><i style="background:#b2f0be"></i></button>
  <button type="button" data-nt2="hl:255,196,214" title="粉色荧光笔"><i style="background:#ffc4d6"></i></button>
  <button type="button" data-nt2="hl:190,220,255" title="蓝色荧光笔"><i style="background:#bedcff"></i></button>
  <span class="nt-grp">
  <span class="nt-bar-hr"></span>
  <button type="button" class="nt-mk hl" data-nt2="mk:highlight" title="手绘高亮（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk ul" data-nt2="mk:underline" title="手绘下划线（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk bx" data-nt2="mk:box" title="手绘方框（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk ci" data-nt2="mk:circle" title="手绘圈（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk st" data-nt2="mk:strike-through" title="手绘划线（再点一次取消）"><i><em>A</em></i></button>
  </span>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="clear" title="清掉加粗/颜色/荧光笔/手绘标记">清</button>
</div>

<!-- 卡片底下那个「+」点开就是这个 -->
<div class="cd-addm" id="cdAddM" hidden>
  <div class="am-t">基础</div>
  <div class="am-grid">
    <button type="button" data-ins="h" title="一段小标题">
      <span class="am-gl">H1</span><i>标题</i>
    </button>
    <button type="button" data-ins="ul" title="一行一条">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4.7 7h.01M4.7 12h.01M4.7 17h.01"/>
        <path d="M9.2 7h10.2M9.2 12h10.2M9.2 17h10.2"/>
      </svg><i>列表</i>
    </button>
    <button type="button" data-ins="quo" title="引一段话">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9.9 5.5C6.5 7.1 4.7 9.7 4.7 12.9c0 2.2 1.4 3.9 3.4 3.9 1.8 0 3.1-1.3 3.1-3 0-1.6-1.1-2.8-2.7-2.8h-.4c.3-1.3 1.3-2.4 2.9-3.2zM18.9 5.5c-3.4 1.6-5.2 4.2-5.2 7.4 0 2.2 1.4 3.9 3.4 3.9 1.8 0 3.1-1.3 3.1-3 0-1.6-1.1-2.8-2.7-2.8h-.4c.3-1.3 1.3-2.4 2.9-3.2z"/>
      </svg><i>引用</i>
    </button>
    <button type="button" data-ins="hr" title="一条分隔线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3.4 12h17.2"/>
      </svg><i>分割线</i>
    </button>
  </div>
  <div class="am-t">常用</div>
  <button type="button" class="am-row" data-ins="code">
    <span class="am-ic">{ }</span>
    <span class="am-tx"><b>代码块</b><i>提示词、命令都写这儿，换行留得住</i></span>
  </button>
</div>

<div class="cd-toast" id="toast"></div>

<script src="assets/vendor/rough-notation.js?v=1118s"></script>
<script src="assets/tk.js?v=1118w"></script>
<script src="assets/ntbar.js?v=1118s"></script>
<script src="assets/mark.js?v=1118s"></script>
<script src="assets/grid-bg.js?v=1118t"></script>
<script src="assets/sync.js?v=1127a"></script>
<script src="assets/store.js?v=1120a"></script>
<script src="assets/cards.js?v=1125a"></script>
<script>window.CDSHARED = 1;   /* 主题/同步/顶栏按钮归 cards.js 管，策划只管自己的清单 */</script>
<script src="assets/calendar.js?v=1131a"></script>
<script src="assets/planner.js?v=1131a"></script>
<script src="assets/planner-view.js?v=1131a"></script>
</body>
</html>
