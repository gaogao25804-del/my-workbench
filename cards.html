<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>策划管理 · 这个月要交什么</title>
<link rel="stylesheet" href="assets/desk.css?v=1118w">
<link rel="stylesheet" href="assets/cards.css?v=1124c">
<link rel="stylesheet" href="assets/planner.css?v=1124c">
</head>
<body class="cd-page">

<div class="cd-bg" aria-hidden="true"><canvas></canvas></div>

<header class="cd-bar">
  <b class="cd-title">策划管理</b>
  <span class="cd-sub">左边是这个月要交什么，右边写卡</span>
  <div class="grow"></div>
  <button class="dk-cloud" id="btnSync" type="button" title="同步：手机上打开就能看到同一份">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.4 18.4h9.9a3.6 3.6 0 0 0 .5-7.2 5.3 5.3 0 0 0-10.2-1.5 4.1 4.1 0 0 0-.2 8.7z"/>
    </svg>
    <i>只在本机</i>
  </button>
  <button class="cd-btn" id="btnTheme" type="button" title="切换深浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/>
    </svg>
  </button>
  <button class="cd-btn" id="btnTrash" type="button" title="删掉的卡片都在这儿，能捡回来">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 6.8h15M9.4 6.8V5.2a1.4 1.4 0 0 1 1.4-1.4h2.4a1.4 1.4 0 0 1 1.4 1.4v1.6"/>
      <path d="M6.4 6.8 7.3 19a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.9-12.2"/>
    </svg>
    回收站<i id="trashN">0</i>
  </button>
</header>

<!-- 一屏两半：左边这个月要交什么，右边写卡。谁也不挡谁，都在同一页里 -->
<main class="cd-split">

  <!-- ==================== 左：这个月要交什么 ==================== -->
  <div class="pl-wrap" id="planPane">

    <section class="pl-head">
      <div class="pl-head-t">
        <h1>这个月要交什么</h1>
        <p id="plHeadSub">—</p>
      </div>
      <div class="pl-people" id="plPeople"></div>
    </section>

    <!-- 这个月：圆环 + 月份切换 -->
    <section class="pl-card pl-now">
      <div class="pl-now-row">
        <div class="pl-ring" id="plRing">
          <div class="pl-ring-in"><b id="plRate">0%</b><i>完成</i></div>
        </div>
        <div class="pl-now-b">
          <b class="pl-now-ym" id="plYm">2026 年 11 月</b>
          <p class="pl-now-sub" id="plNowSub">这个月还没排东西</p>
          <div class="pl-month-nav">
            <button class="pl-round" type="button" id="plPrev" title="上个月" aria-label="上个月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
            </button>
            <label class="pl-round pl-pickwrap" title="直接选月份">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3.4" y="5.4" width="17.2" height="15.2" rx="2.6"/>
                <path d="M8 3.4v3.6M16 3.4v3.6M3.4 10.2h17.2"/>
              </svg>
              <input class="pl-pick" id="plPick" type="month" aria-label="选择月份">
            </label>
            <button class="pl-round" type="button" id="plNext" title="下个月" aria-label="下个月">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
            </button>
            <button class="pl-round pl-today" type="button" id="plToday" title="回到本月">今</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 本月概览：六块彩色小卡 -->
    <section class="pl-card pl-sum">
      <div class="pl-hd">
        <span class="pl-hd-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.6" y="3.6" width="7.2" height="7.2" rx="2.2"/>
            <rect x="13.2" y="3.6" width="7.2" height="7.2" rx="2.2"/>
            <rect x="3.6" y="13.2" width="7.2" height="7.2" rx="2.2"/>
            <rect x="13.2" y="13.2" width="7.2" height="7.2" rx="2.2"/>
          </svg>
        </span>
        <b>本月概览</b>
        <span class="pl-hd-sub" id="plSumSub">点一张卡就只看那一类</span>
        <div class="grow"></div>
        <button class="pl-round" type="button" id="plClear" title="取消筛选" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M6.4 6.4l11.2 11.2M17.6 6.4 6.4 17.6"/></svg>
        </button>
      </div>
      <div class="pl-tiles" id="plTiles"></div>
    </section>

    <!-- 加一条 -->
    <section class="pl-card pl-new" id="plNew">
      <div class="pl-hd pl-new-hd">
        <span class="pl-hd-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg>
        </span>
        <b>加一条</b>
        <span class="pl-hd-sub" id="plNewTip">名称必填，回车就加</span>
        <div class="grow"></div>
        <button class="pl-round pl-new-tog" type="button" id="plNewTog" title="展开 / 收起" aria-expanded="false" aria-controls="plForm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.6v12.8M5.6 12h12.8"/></svg>
        </button>
      </div>

      <form id="plForm" autocomplete="off">
        <label class="pl-field">
          <span class="pf-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15.4 4.6l4 4L8.2 19.8H4.2v-4z"/>
            </svg>
          </span>
          <span class="pf-b"><i>计划名称</i>
            <input class="pf-in" id="fName" type="text" placeholder="iPhone Duo 退货那条口播" spellcheck="false">
          </span>
        </label>

        <label class="pl-field">
          <span class="pf-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8.4" r="3.6"/><path d="M5.2 19.8a6.8 6.8 0 0 1 13.6 0"/>
            </svg>
          </span>
          <span class="pf-b"><i>账号</i><select class="pf-in" id="fAcct"></select></span>
          <svg class="pf-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10l4 4 4-4"/></svg>
        </label>

        <label class="pl-field">
          <span class="pf-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.4" y="5.4" width="17.2" height="15.2" rx="2.6"/>
              <path d="M8 3.4v3.6M16 3.4v3.6M3.4 10.2h17.2"/>
            </svg>
          </span>
          <span class="pf-b"><i>截止日期（可以不填）</i><input class="pf-in" id="fDue" type="date"></span>
        </label>

        <label class="pl-field">
          <span class="pf-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5.4 6.6h13.2M5.4 12h13.2M5.4 17.4h8"/>
            </svg>
          </span>
          <span class="pf-b"><i>备注</i><input class="pf-in" id="fNote" type="text" placeholder="不一定写" spellcheck="false"></span>
        </label>

        <label class="pl-field">
          <span class="pf-ic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.4 3.8v16.4"/><path d="M6.4 4.6h11l-2.4 4 2.4 4h-11z"/>
            </svg>
          </span>
          <span class="pf-b"><i>进度</i>
            <select class="pf-in" id="fSt">
              <option value="todo">未开始</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
            </select>
          </span>
          <svg class="pf-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10l4 4 4-4"/></svg>
        </label>

        <button class="pl-submit" type="submit" id="plAdd">加进去</button>
      </form>
    </section>

    <!-- 这个月的计划 -->
    <section class="pl-card pl-listcard">
      <div class="pl-hd">
        <span class="pl-hd-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.4 6.6h11.2M8.4 12h11.2M8.4 17.4h11.2"/>
            <path d="M4.2 6.6h.01M4.2 12h.01M4.2 17.4h.01"/>
          </svg>
        </span>
        <b>这个月的计划</b>
        <span class="pl-hd-sub" id="plSorted">按截止日期排</span>
        <div class="grow"></div>
        <div class="pl-chips" id="plChips"></div>
      </div>
      <div class="pl-trackbox">
        <div class="pl-track"><i id="plTrackFill"></i></div>
        <div class="pl-ticks"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
      </div>
      <div class="pl-rows" id="plRows"></div>
    </section>

    <!-- 账号进度 -->
    <section class="pl-card pl-bars-card">
      <div class="pl-hd">
        <span class="pl-hd-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.8 19.4v-7.2M12 19.4V5.2M19.2 19.4v-4.6"/>
          </svg>
        </span>
        <b>账号进度</b>
        <span class="pl-hd-sub" id="plBarsSub">这个月各交了多少</span>
      </div>
      <div class="pl-bars" id="plBars"></div>
    </section>

  </div>

  <!-- ==================== 右：卡片库 ==================== -->
  <div class="cd-main" id="cardPane">

    <aside class="cd-tree" id="cdTreeWrap">
      <div class="cd-find">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.6"/><path d="M16.2 16.2 20 20"/>
        </svg>
        <input id="cdFind" type="text" placeholder="找一张卡…" autocomplete="off" spellcheck="false">
        <button class="cd-find-x" type="button" id="cdFindX" title="清掉">✕</button>
      </div>
      <div class="cd-tree-body" id="cdTree"></div>
      <div class="cd-tree-foot" id="cdSum"></div>
    </aside>

    <section class="cd-pane" id="cdPane"></section>

  </div>

</main>

<aside class="cd-drawer" id="drawer">
  <div class="cd-dw-hd">
    <b>回收站</b>
    <span id="dwSub">删掉的卡片都在这儿</span>
    <button class="cd-dw-x" type="button" id="dwClose" title="关上">✕</button>
  </div>
  <div class="cd-dw-list" id="dwList"></div>
  <div class="cd-dw-ft">
    <button class="cd-btn is-danger" type="button" id="dwEmpty">清空回收站</button>
  </div>
</aside>

<div class="nt-bar" id="noteBar" hidden>
  <button type="button" data-nt2="b" title="加粗（Ctrl+B）"><b>B</b></button>
  <span class="nt-bar-hr"></span>
  <button type="button" class="nt-fg" data-nt2="fg:d" title="恢复默认颜色"><span>A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:r" title="红色"><span style="color:var(--fg-red)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:o" title="橙色"><span style="color:var(--fg-orange)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:g" title="绿色"><span style="color:var(--fg-green)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:b" title="蓝色"><span style="color:var(--fg-blue)">A</span></button>
  <button type="button" class="nt-fg" data-nt2="fg:p" title="紫色"><span style="color:var(--fg-purple)">A</span></button>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="hl:255,232,120" title="黄色荧光笔"><i style="background:#ffe878"></i></button>
  <button type="button" data-nt2="hl:178,240,190" title="绿色荧光笔"><i style="background:#b2f0be"></i></button>
  <button type="button" data-nt2="hl:255,196,214" title="粉色荧光笔"><i style="background:#ffc4d6"></i></button>
  <button type="button" data-nt2="hl:190,220,255" title="蓝色荧光笔"><i style="background:#bedcff"></i></button>
  <span class="nt-grp">
  <span class="nt-bar-hr"></span>
  <button type="button" class="nt-mk hl" data-nt2="mk:highlight" title="手绘高亮（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk ul" data-nt2="mk:underline" title="手绘下划线（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk bx" data-nt2="mk:box" title="手绘方框（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk ci" data-nt2="mk:circle" title="手绘圈（再点一次取消）"><i><em>A</em></i></button>
  <button type="button" class="nt-mk st" data-nt2="mk:strike-through" title="手绘划线（再点一次取消）"><i><em>A</em></i></button>
  </span>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="clear" title="清掉加粗/颜色/荧光笔/手绘标记">清</button>
</div>

<!-- 卡片底下那个「+」点开就是这个：插入代码块 / 标题 / 列表 / 引用 / 分割线 -->
<div class="cd-addm" id="cdAddM" hidden>
  <div class="am-t">基础</div>
  <div class="am-grid">
    <button type="button" data-ins="h" title="一段小标题">
      <span class="am-gl">H1</span><i>标题</i>
    </button>
    <button type="button" data-ins="ul" title="一行一条">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4.7 7h.01M4.7 12h.01M4.7 17h.01"/>
        <path d="M9.2 7h10.2M9.2 12h10.2M9.2 17h10.2"/>
      </svg><i>列表</i>
    </button>
    <button type="button" data-ins="quo" title="引一段话">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M9.9 5.5C6.5 7.1 4.7 9.7 4.7 12.9c0 2.2 1.4 3.9 3.4 3.9 1.8 0 3.1-1.3 3.1-3 0-1.6-1.1-2.8-2.7-2.8h-.4c.3-1.3 1.3-2.4 2.9-3.2zM18.9 5.5c-3.4 1.6-5.2 4.2-5.2 7.4 0 2.2 1.4 3.9 3.4 3.9 1.8 0 3.1-1.3 3.1-3 0-1.6-1.1-2.8-2.7-2.8h-.4c.3-1.3 1.3-2.4 2.9-3.2z"/>
      </svg><i>引用</i>
    </button>
    <button type="button" data-ins="hr" title="一条分隔线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3.4 12h17.2"/>
      </svg><i>分割线</i>
    </button>
  </div>
  <div class="am-t">常用</div>
  <button type="button" class="am-row" data-ins="code">
    <span class="am-ic">{ }</span>
    <span class="am-tx"><b>代码块</b><i>提示词、命令都写这儿，换行留得住</i></span>
  </button>
</div>

<div class="cd-toast" id="toast"></div>

<script src="assets/vendor/rough-notation.js?v=1118s"></script>
<script src="assets/tk.js?v=1118w"></script>
<script src="assets/ntbar.js?v=1118s"></script>
<script src="assets/mark.js?v=1118s"></script>
<script src="assets/grid-bg.js?v=1118t"></script>
<script src="assets/sync.js?v=1123a"></script>
<script src="assets/store.js?v=1120a"></script>
<script src="assets/cards.js?v=1124c"></script>
<script>window.CDSHARED = 1;   /* 同一个页面里，主题/同步/顶栏按钮都归 cards.js 管，策划只管自己的清单 */</script>
<script src="assets/planner.js?v=1124c"></script>
</body>
</html>
