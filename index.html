<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>我的工作台 · 文档桌面</title>
<link rel="stylesheet" href="assets/desk.css?v=1118k">
</head>
<body>

<header class="dk-bar">
  <div class="dk-brand">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <g fill="#ff8b55">
        <rect x="6" y="0" width="4" height="3"/><rect x="6" y="13" width="4" height="3"/>
        <rect x="0" y="6" width="3" height="4"/><rect x="13" y="6" width="3" height="4"/>
        <rect x="2" y="2" width="3" height="3"/><rect x="11" y="2" width="3" height="3"/>
        <rect x="2" y="11" width="3" height="3"/><rect x="11" y="11" width="3" height="3"/>
      </g>
      <rect x="6" y="6" width="4" height="4" fill="#ff6a2f"/>
    </svg>
    我的工作台
    <span class="dk-brand-sub">文档摆一块儿，不用来回切</span>
  </div>

  <div class="grow"></div>

  <div class="dk-actions">
    <span class="dk-save" id="saveState">—</span>
    <button class="dk-link" id="btnSkin" type="button" title="卡片外观：圆角 / 阴影 / 悬停浮起 / 字号，全部自己调">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.4a8.6 8.6 0 0 0 0 17.2c1.5 0 2.2-.9 2.2-1.9 0-1.4-1.3-1.6-1.3-2.6 0-.9.8-1.6 1.9-1.6h1.4a4.4 4.4 0 0 0 4.4-4.5c0-3.7-3.6-6.6-8.6-6.6z"/>
        <circle cx="8.2" cy="9.4" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="12.4" cy="7.4" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="16.2" cy="9.8" r="1.15" fill="currentColor" stroke="none"/>
      </svg>
      <span class="lbl2">外观</span>
    </button>
    <button class="dk-link" id="btnLock" type="button" title="把当前布局固定住：锁上以后卡片不会被动到（右键看备份）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.6" y="10.4" width="14.8" height="9.6" rx="2.2"/>
        <path d="M8.3 10.4V7.7a3.7 3.7 0 0 1 7.4 0v2.7"/>
      </svg>
      <span class="lbl2">锁定</span>
    </button>
    <button class="dk-link" id="btnNote" type="button" title="新建一张小卡片：写字、标重点，随便摆">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.4" y="4.6" width="17.2" height="14.8" rx="2.6"/>
        <path d="M7.4 9.6h9.2M7.4 13h6.4"/>
      </svg>
      <span class="lbl2">新建卡片</span>
    </button>
    <button class="dk-link" id="btnLink" type="button" title="贴飞书文档 / 任意网页链接，直接摆在画布上">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.6 13.4a4 4 0 0 0 5.7 0l2.9-2.9a4 4 0 1 0-5.7-5.7l-1.5 1.5"/>
        <path d="M13.4 10.6a4 4 0 0 0-5.7 0l-2.9 2.9a4 4 0 1 0 5.7 5.7l1.5-1.5"/>
      </svg>
      <span class="lbl2">贴链接</span>
    </button>
    <button class="dk-btn is-icon" id="btnTheme" type="button" title="切换浅色 / 深色" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/>
      </svg>
    </button>
    <button class="dk-btn is-primary" id="btnAdd" type="button" title="添加 Word / Excel / PDF / TXT">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5.5v13M5.5 12h13"/>
      </svg>
      <span class="lbl">添加文件</span>
    </button>
  </div>
</header>

<main class="dk-canvas" id="canvas">
  <div class="dk-stage" id="stage"></div>
</main>

<div class="dk-empty" id="empty">
  <div class="big">画布是空的</div>
  <div class="small">
    把 DOCX / XLSX / XLS / PDF / TXT 直接拖进这个页面<br>
    或者点右上角 <kbd>添加文件</kbd>，一个个放进来，随便摆
  </div>
</div>

<div class="dk-drop" id="drop"><div class="box">松手，放进画布</div></div>
<div class="dk-toast" id="toast"></div>

<!-- 贴链接 -->
<div class="dk-modal" id="linkModal">
  <div class="dk-modal-c">
    <div class="dk-modal-t">贴个链接放上来</div>
    <input class="dk-input" id="linkInput" type="text" spellcheck="false"
           placeholder="https://xxx.feishu.cn/docx/xxxx  或任意网页地址">
    <div class="dk-modal-hint">
      飞书文档要先在右上角「分享」里把权限改成 <b>互联网上获得链接的人可阅读</b>，否则窗口里会是空白。<br>
      空白不代表坏了：有些站点不允许被嵌，点窗口里「在新标签打开」照样能看。
    </div>
    <div class="dk-modal-a">
      <button class="dk-btn" type="button" data-lk="no">算了</button>
      <button class="dk-btn is-primary" type="button" data-lk="ok">放到画布</button>
    </div>
  </div>
</div>

<!-- 新建小卡片：三选一 -->
<div class="dk-modal" id="noteModal">
  <div class="dk-modal-c is-wide">
    <div class="dk-modal-t">要哪种卡片</div>
    <div class="nt-picks">
      <button type="button" class="nt-pick" data-nt="sop">
        <span class="nt-pv is-tk is-sop">
          <span class="pv-top"><span class="pv-br"><i></i>SOP</span><span class="pv-no">NO.001 · DAILY</span></span>
          <span class="pv-halo"></span>
          <span class="pv-big">5 步</span>
          <span class="pv-sub">从选题到 19:00 发出</span>
          <span class="pv-line">ADMIT ONE // 存档凭证</span>
        </span>
        <span class="nt-nm">SOP 卡</span>
      </button>
      <button type="button" class="nt-pick" data-nt="hard">
        <span class="nt-pv is-tk is-hard">
          <span class="pv-top"><span class="pv-br"><i></i>HARD</span><span class="pv-no">NO.002 · OPEN</span></span>
          <span class="pv-halo"></span>
          <span class="pv-big">卡了 3 天</span>
          <span class="pv-sub">卡在哪 / 为什么 / 怎么破</span>
          <span class="pv-line">ADMIT ONE // 存档凭证</span>
        </span>
        <span class="nt-nm">困难卡</span>
      </button>
      <button type="button" class="nt-pick" data-nt="hook">
        <span class="nt-pv is-tk is-hook">
          <span class="pv-top"><span class="pv-br"><i></i>HOOK</span><span class="pv-no">NO.003 · 0–5S</span></span>
          <span class="pv-halo"></span>
          <span class="pv-big">0–5 秒</span>
          <span class="pv-sub">第一句话 / 配什么画面 / 为什么留人</span>
          <span class="pv-line">ADMIT ONE // 存档凭证</span>
        </span>
        <span class="nt-nm">前五秒卡</span>
      </button>
    </div>
    <div class="dk-modal-hint">
      三种都是票根卡：一张卡＝一条能存档的东西。放到画布后<b>点哪块改哪块</b>，Enter 换行，Tab 跳下一格。<br>
      编号和日期自动带上；鼠标压上去右上角才出按钮，点「换样式」可以在三种之间来回换，内容不丢。
    </div>
    <div class="dk-modal-a">
      <button class="dk-btn" type="button" data-nm="no">算了</button>
    </div>
  </div>
</div>

<!-- 便签选中文字时浮出的工具条 -->
<div class="nt-bar" id="noteBar" hidden>
  <button type="button" data-nt2="b" title="加粗"><b>B</b></button>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="hl:255,232,120" title="黄色荧光笔"><i style="background:#ffe878"></i></button>
  <button type="button" data-nt2="hl:178,240,190" title="绿色荧光笔"><i style="background:#b2f0be"></i></button>
  <button type="button" data-nt2="hl:255,196,214" title="粉色荧光笔"><i style="background:#ffc4d6"></i></button>
  <button type="button" data-nt2="hl:190,220,255" title="蓝色荧光笔"><i style="background:#bedcff"></i></button>
  <span class="nt-bar-hr"></span>
  <button type="button" data-nt2="clear" title="清掉加粗/荧光笔/字号">清</button>
</div>

<div class="dk-lockmenu" id="lockMenu" hidden>
  <div class="lk-t">布局</div>
  <button type="button" data-lk2="toggle">锁定当前布局</button>
  <button type="button" data-lk2="back">还没锁定过</button>
  <button type="button" data-lk2="prev" hidden>回到上一版</button>
  <div class="lk-hr"></div>
  <button type="button" data-lk2="export">导出一份备份（.json）</button>
  <button type="button" data-lk2="import">从备份恢复…</button>
</div>
<input type="file" id="fjson" accept=".json" hidden>

<input type="file" id="fpick" multiple accept=".docx,.xlsx,.xls,.pdf,.txt" hidden>
<input type="file" id="freplace" accept=".docx,.xlsx,.xls,.pdf,.txt" hidden>

<script src="assets/vendor/mammoth.browser.min.js"></script>
<script src="assets/vendor/xlsx.full.min.js"></script>
<script src="assets/vendor/pdf.min.js"></script>
<script src="assets/desk-parse.js?v=1118j"></script>
<script src="assets/desk.js?v=1118k"></script>
<script src="assets/desk-skin.js?v=1118k"></script>
</body>
</html>
