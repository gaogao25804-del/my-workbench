<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060607">
<title>个人工作台</title>
<link rel="stylesheet" href="assets/workbench.css">
</head>
<body>

<div class="app">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="side-brand-row">
        <div class="side-logo" aria-hidden="true"><svg viewBox="0 0 16 16"><g fill="#ff8b55"><rect x="6" y="0" width="4" height="3"/><rect x="6" y="13" width="4" height="3"/><rect x="0" y="6" width="3" height="4"/><rect x="13" y="6" width="3" height="4"/><rect x="2" y="2" width="3" height="3"/><rect x="11" y="2" width="3" height="3"/><rect x="2" y="11" width="3" height="3"/><rect x="11" y="11" width="3" height="3"/></g><rect x="6" y="6" width="4" height="4" fill="#ff6a2f"/></svg></div>
        <div class="side-name">个人工作台</div>
        <button class="icon-btn side-close" id="sideClose" aria-label="关闭导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="side-sub">任务 · 藏书 · 文案 · 口播 · 像素 · 画板</div>
    </div>

    <nav class="side-nav" id="sideNav">
      <div class="side-label">工作区</div>
      <div class="nav-item active" data-nav="home">
        <span data-icon="home"></span><span>主页</span>
      </div>
      <div class="nav-item" data-nav="tasks">
        <span data-icon="calendar"></span><span>任务与日历</span>
        <span class="nav-count" id="navTaskCount">—</span>
      </div>
      <div class="side-label">资料库</div>
      <div class="nav-item" data-nav="library">
        <span data-icon="book"></span><span>图书馆</span>
        <span class="nav-count" id="navLibCount">—</span>
      </div>
      <div class="nav-item" data-nav="wenan">
        <span data-icon="file"></span><span>文案库</span>
        <span class="nav-count" id="navWenanCount">7</span>
      </div>
      <div class="side-label">创作</div>
      <div class="nav-item" data-nav="koubo">
        <span data-icon="mic"></span><span>口播工坊</span>
      </div>
      <div class="side-label">工具</div>
      <div class="nav-item" data-nav="pixel">
        <span data-icon="pixel"></span><span>像素工坊</span>
      </div>
      <div class="nav-item" data-nav="draw">
        <span data-icon="palette"></span><span>画板</span>
      </div>
    </nav>

    <div class="side-foot">
      数据为本地快照<br>
      <span id="sideUpdated">—</span>
    </div>
  </aside>

  <div class="sidebar-mask" id="sidebarMask"></div>

  <!-- 主区域 -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="topbar-main">
        <div class="topbar-title" id="pageTitle">主页</div>
        <div class="topbar-desc" id="pageDesc">工作台概览</div>
      </div>
      <div class="topbar-actions" id="pageActions"></div>
    </header>

    <div class="content" id="view"></div>

    <footer class="foot">
      飞书数据来自本地同步快照 · 文案文件保存在本机仓库
    </footer>
  </main>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<button class="fab" id="fabTop" aria-label="回到顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M5.6 12.4 12 6l6.4 6.4"/></svg></button>
<div id="modalRoot"></div>

<script src="assets/workbench.js"></script>
</body>
</html>
