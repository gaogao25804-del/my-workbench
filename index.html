<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>数码内容工作台</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#17191d;--muted:#737b87;--line:#e7e9ed;--accent:#f06a35;--soft:#fff1e9;--green:#16835d;--radius:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:17px;padding:4px 10px 22px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:3px}
.navlabel{color:#9aa1aa;font-size:10px;letter-spacing:.12em;padding:15px 10px 6px}
.nav button{display:flex;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:#505864;margin:2px 0}
.nav button.active{background:var(--soft);color:#a8431b;font-weight:700}.nav button span{margin-left:auto;color:#a1a7af;font-size:11px}
main{min-width:0}.top{height:68px;background:#ffffffdf;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 30px;position:sticky;top:0;z-index:3}
.top h1{font-size:18px;margin:0}.top p{font-size:11px;color:var(--muted);margin:2px 0 0}.content{max-width:1200px;padding:26px 30px 60px;margin:auto}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:20px}.pagehead h2{font-size:23px;margin:0 0 4px}.muted{color:var(--muted)}.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:15px;min-width:0}
.grid{display:grid;gap:12px;min-width:0}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:15px;background:#fff;border:1px solid var(--line);border-radius:13px;min-width:0}.stat label{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:24px;margin-top:5px;font-variant-numeric:tabular-nums}
.cols{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
h3{font-size:14px;margin:0 0 13px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;color:#30343a}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.orange{background:var(--soft);border-color:#ffd6c2;color:#a8431b}.btn.danger{color:#b42318}
input,textarea,select{width:100%;border:1px solid #dfe2e7;border-radius:9px;padding:10px 11px;background:white;outline:none;color:var(--ink)}input:focus,textarea:focus,select:focus{border-color:#9ca3af}textarea{min-height:110px;resize:vertical}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:#5f6874;margin-bottom:5px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.wrap{flex-wrap:wrap}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:6px 11px;background:white;color:#68717c;font-size:12px}.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.tablewrap{overflow:auto;max-width:100%;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:740px;font-size:12px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#727b87;font-weight:600;background:#fafbfc;position:sticky;top:0}tbody tr{cursor:pointer}tbody tr:hover{background:#fafafa}
.list{display:grid;gap:9px;min-width:0}.item{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;min-width:0;overflow-wrap:anywhere}.itemtop{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:13px}.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#f0f2f5;color:#606a76;font-size:10px;margin:3px 4px 0 0}.tag.good{background:#e9f6ef;color:#16734f}.tag.warn{background:#fff3df;color:#8a5a00}
.empty{padding:28px;text-align:center;color:#8b929c}.notice{padding:11px 13px;background:#f7f8fa;border-radius:9px;color:#68717c;font-size:12px}
.hidden{display:none!important}.monthrow{display:flex;gap:7px;flex-wrap:wrap}.metricgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{background:#f8f9fb;padding:11px;border-radius:9px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:16px}
@media(max-width:850px){.shell{display:block}aside{position:static;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:5px 8px 10px}.navlabel{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{white-space:nowrap;width:auto;flex:0 0 auto;padding:8px 11px}.nav button span{display:none}.top{height:58px;padding:0 16px}.content{padding:18px 14px 40px}.stats{grid-template-columns:repeat(2,1fr)}.cols,.three{grid-template-columns:1fr}.metricgrid{grid-template-columns:repeat(2,1fr)}.pagehead{align-items:flex-start;flex-direction:column}.pagehead h2{font-size:21px}}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="brand">数码内容工作台<small>围绕播放量 · 选题 · 内容复用</small></div>
  <div class="navlabel">内容生产</div>
  <nav class="nav" id="nav">
    <button data-page="report" class="active">战报 <span id="reportCount">—</span></button>
    <button data-page="account">账号拆解</button>
    <button data-page="trends">热门选题</button>
    <button data-page="hooks">五秒开头</button>
    <button data-page="sop">SOP 库</button>
  </nav>
</aside>
<main>
  <header class="top"><div><h1 id="topTitle">战报</h1><p>用真实数据复盘，用验证过的方法提高稳定产出</p></div></header>
  <div class="content" id="app"></div>
</main>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const STORE='digitalWorkbench.v2';
const EMPTY=()=>({accounts:[],ideas:[],hooks:[],sops:[]});
let db;
try{db=JSON.parse(localStorage.getItem(STORE)||'null')||EMPTY()}catch(e){console.warn('本地数据损坏，已按空库启动',e);db=EMPTY()}
['accounts','ideas','hooks','sops'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){alert('保存失败：浏览器存储不可用或已满。请关闭无痕模式后重试。')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(n){return Number(n||0).toLocaleString('zh-CN')}
function pct(n){return n==null?'—':(Number(n)*100).toFixed(2)+'%'}
/* 战报 JSON 的 t 有三种：num 整数 / dec 小数 / rate 比率。原战报按类型显示，这里保持一致 */
function fmtVal(t,v){if(t==='rate')return pct(v);if(v==null||v==='')return '—';if(t==='dec')return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:1});return num(v)}
function page(p){state.page=p;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#topTitle').textContent=({report:'战报',account:'账号拆解',trends:'热门选题',hooks:'五秒开头',sop:'SOP 库'})[p];render()}
const state={page:'report',report:null,month:0,type:'',query:''};
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});
async function loadReport(){
 try{const r=await fetch('content/report/index.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state.report=await r.json();$('#reportCount').textContent=num((state.report.months||[]).reduce((a,m)=>a+(m.rows||[]).length,0));}
 catch(e){state.report={months:[]};console.error(e)}
 render();
}
function render(){const root=$('#app');({report:renderReport,account:renderAccount,trends:renderTrends,hooks:renderHooks,sop:renderSop})[state.page](root);if(state.page!=='report'){const n=document.createElement('div');n.className='notice';n.style.marginBottom='14px';n.innerHTML='<b>本地存储说明：</b>新增记录只保存在当前设备的浏览器里，不会自动跨设备同步。换手机、换浏览器或清理浏览器数据会丢失，请自行备份。';root.prepend(n)}}
function renderReport(root){
 const months=state.report?.months||[];
 if(!months.length){root.innerHTML='<div class="card empty">战报数据加载失败。请确认 content/report/index.json 文件仍在仓库中，且页面部署在 GitHub Pages 根目录。</div>';return}
 state.month=Math.min(state.month,months.length-1);const m=months[state.month],ov=m.overview||[],rows=m.rows||[];
 const top=m.top||{},compare=m.compare||{};
 root.innerHTML=`
 <div class="pagehead"><div><h2>数据战报</h2><div class="muted small">原始战报 JSON · 更新于 ${esc(state.report.updated_at||'未知')}</div></div><div class="monthrow">${months.map((x,i)=>`<button class="pill ${i===state.month?'active':''}" data-month="${i}">${esc(x.label||x.key)}</button>`).join('')}</div></div>
 <div class="grid stats">${ov.slice(0,8).map(x=>`<div class="stat"><label>${esc(x.k)}</label><strong>${fmtVal(x.t,x.v)}</strong></div>`).join('')}</div>
 <div class="card"><h3>关键指标</h3><div class="metricgrid">${ov.slice(8).map(x=>`<div class="metric"><span>${esc(x.k)}</span><b>${fmtVal(x.t,x.v)}</b></div>`).join('')}</div></div>
 <div class="grid cols"><div class="card"><h3>引流 / 内容对比</h3><div class="tablewrap"><table><thead><tr><th>指标</th>${(compare.cols||[]).map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${(compare.rows||[]).map(r=>`<tr><td>${esc(r.k)}</td>${(r.v||[]).map(v=>`<td>${fmtVal(r.t,v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>播放量 TOP 10</h3><div class="pills"><button class="pill active" data-top="引流">引流视频</button><button class="pill" data-top="内容">内容视频</button></div><div id="toplist"></div></div></div>
 <div class="card"><div class="row wrap" style="justify-content:space-between"><h3 style="margin:0">视频明细</h3><span class="muted small" id="rowCount">${rows.length} 条</span></div>
 <div class="row wrap" style="margin:12px 0"><input id="searchRows" placeholder="搜索视频标题…" style="flex:1;min-width:180px"><button class="pill active" data-type="">全部</button><button class="pill" data-type="引流视频">引流</button><button class="pill" data-type="内容视频">内容</button></div>
 <div class="tablewrap"><table><thead><tr><th>日期</th><th>视频标题</th><th>类型</th><th>播放量</th><th>完播率</th><th>点赞</th><th>评论</th><th>分享</th><th>收藏</th><th>涨粉</th></tr></thead><tbody id="detailRows"></tbody></table></div></div>`;
 let topType='引流';const drawTop=()=>{const arr=top[topType]||[];$('#toplist').innerHTML=arr.map(x=>`<div class="item"><div class="itemtop"><strong>${x.rank}. ${esc(x.title)}</strong><b>${num(x.play)}</b></div><div class="muted small">${esc(x.date)} · ${esc(x.fmt)} · 点赞 ${num(x.like)} · 涨粉 ${num(x.fans)}</div></div>`).join('')||'<div class="empty">暂无数据</div>'};
 drawTop();
 $$('[data-month]').forEach(b=>b.onclick=()=>{state.month=+b.dataset.month;render()});
 $$('[data-top]').forEach(b=>b.onclick=()=>{topType=b.dataset.top;$$('[data-top]').forEach(x=>x.classList.toggle('active',x===b));drawTop()});
 let typ='';function drawRows(){const q=$('#searchRows').value.trim().toLowerCase();const arr=rows.filter(x=>(!typ||x.type===typ)&&(!q||String(x.title).toLowerCase().includes(q)));$('#rowCount').textContent=arr.length===rows.length?`${arr.length} 条`:`${arr.length} / ${rows.length} 条`;$('#detailRows').innerHTML=arr.map(x=>`<tr><td>${esc(x.date)}</td><td style="white-space:normal;min-width:240px">${esc(x.title)}</td><td>${esc(x.type)}</td><td>${num(x.play)}</td><td>${pct(x.fin)}</td><td>${num(x.like)}</td><td>${num(x.cmt)}</td><td>${num(x.share)}</td><td>${num(x.fav)}</td><td>${num(x.fans)}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">没有匹配的视频</td></tr>'}
 $('#searchRows').oninput=drawRows;$$('[data-type]').forEach(b=>b.onclick=()=>{typ=b.dataset.type;$$('[data-type]').forEach(x=>x.classList.toggle('active',x===b));drawRows()});drawRows();
}
function renderAccount(root){
 root.innerHTML=`<div class="pagehead"><div><h2>账号拆解</h2><div class="muted small">把对标账号拆成可复用的选题、结构和拍摄方法</div></div></div>
 <div class="card"><h3>新建拆解任务</h3><div class="field"><label>抖音账号 / 视频链接</label><input id="accUrl" placeholder="粘贴主页或视频链接"></div><div class="field"><label>你想研究什么</label><select id="accGoal"><option>账号定位与内容结构</option><option>爆款选题规律</option><option>单条视频拆解</option><option>拍摄剪辑 SOP</option></select></div><div class="field"><label>补充素材或观察（可选）</label><textarea id="accNotes" placeholder="例如：近期高赞视频标题、截图里能看到的数据、视频口播转写……"></textarea></div><div class="row wrap"><button class="btn primary" id="makeAccPrompt">生成拆解指令</button><button class="btn" id="saveAcc">保存记录</button></div><p class="muted small">说明：静态网页不会自动读取抖音私有数据。请把可见素材、截图或转写交给 AI 分析；没有抓取到的数据必须标注未知。</p></div><div class="card"><h3>拆解记录</h3><div id="accList" class="list"></div></div>`;
 $('#makeAccPrompt').onclick=()=>{const url=$('#accUrl').value.trim(),goal=$('#accGoal').value,notes=$('#accNotes').value.trim();const prompt=`请拆解这个抖音账号/视频，研究目标：${goal}\n链接：${url}\n我提供的素材：${notes||'暂无'}\n要求：区分可验证事实、素材推断和未知信息；不要编造播放量、粉丝数、发布时间或互动数据。输出账号定位、目标受众、选题类型、开头钩子、内容结构、镜头/剪辑方法、评论区需求、可迁移的选题模板，以及适合我数码账号验证的3个具体方向。` ;copyText(prompt)};
 $('#saveAcc').onclick=()=>{db.accounts.unshift({id:Date.now(),url:$('#accUrl').value.trim(),goal:$('#accGoal').value,notes:$('#accNotes').value.trim(),date:new Date().toLocaleDateString()});save();renderAccount(root)};
 drawRecords('#accList',db.accounts,'accounts');
}
function renderTrends(root){
 root.innerHTML=`<div class="pagehead"><div><h2>热门选题</h2><div class="muted small">只收录有来源的信号，不把猜测包装成热度数据</div></div><button class="btn orange" id="newIdea">录入选题</button></div>
 <div class="notice">数据规则：每条选题至少记录来源链接和采集日期。播放量、点赞量等只填来源页面明确展示的数字；无法核实就留空。AI 可以分析机会，不可以伪造数据。</div>
 <div class="card hidden" id="ideaForm"><h3>新增选题信号</h3><div class="field"><label>选题 / 热点标题</label><input id="iTitle"></div><div class="grid cols"><div class="field"><label>产品 / 关键词</label><input id="iProduct"></div><div class="field"><label>信号类型</label><select id="iType"><option>新品发布</option><option>用户痛点</option><option>争议话题</option><option>消费决策</option><option>功能体验</option><option>竞品爆款</option><option>其他</option></select></div></div><div class="grid cols"><div class="field"><label>播放量（没有可靠数字就留空）</label><input id="iPlay" type="number" min="0"></div><div class="field"><label>采集日期</label><input id="iDate" type="date"></div></div><div class="field"><label>来源链接（必填）</label><input id="iSource" placeholder="原始视频 / 官方发布 / 可信报道链接"></div><div class="field"><label>为什么值得做 / 观察到的现象</label><textarea id="iWhy"></textarea></div><div class="row"><button class="btn primary" id="saveIdea">保存</button><button class="btn" id="cancelIdea">取消</button></div></div>
 <div class="card"><div class="row wrap" style="justify-content:space-between"><h3 style="margin:0">选题池</h3><input id="ideaSearch" placeholder="搜索标题、产品、关键词" style="max-width:280px"></div><div id="ideaList" class="list" style="margin-top:13px"></div></div>`;
 $('#newIdea').onclick=()=>$('#ideaForm').classList.remove('hidden');$('#cancelIdea').onclick=()=>$('#ideaForm').classList.add('hidden');
 $('#saveIdea').onclick=()=>{const title=$('#iTitle').value.trim(),source=$('#iSource').value.trim();if(!title||!source){alert('标题和来源链接必须填写');return}db.ideas.unshift({id:Date.now(),title,product:$('#iProduct').value,type:$('#iType').value,play:$('#iPlay').value,date:$('#iDate').value||new Date().toISOString().slice(0,10),source,why:$('#iWhy').value});save();renderTrends(root)};
 const draw=()=>drawIdeaList($('#ideaList'),$('#ideaSearch').value);$('#ideaSearch').oninput=draw;draw();
}
function drawIdeaList(el,q=''){const a=db.ideas.filter(x=>(x.title+x.product+x.why).toLowerCase().includes(q.toLowerCase()));el.innerHTML=a.map(x=>`<div class="item"><div class="itemtop"><strong>${esc(x.title)}</strong><button class="btn danger" data-del-idea="${x.id}">删除</button></div><div><span class="tag">${esc(x.type)}</span><span class="tag">${esc(x.product||'未分类')}</span><span class="tag">${x.play?`来源播放量 ${num(x.play)}`:'播放量未核实'}</span><span class="tag">${esc(x.date)}</span></div><p>${esc(x.why||'暂无备注')}</p><a href="${esc(x.source)}" target="_blank" rel="noopener">查看原始来源 ↗</a></div>`).join('')||'<div class="empty">还没有选题。把刷到的有效信号记在这里。</div>';$$('[data-del-idea]',el).forEach(b=>b.onclick=()=>{db.ideas=db.ideas.filter(x=>x.id!==+b.dataset.delIdea);save();drawIdeaList(el,q)})}
function renderHooks(root){
 root.innerHTML=`<div class="pagehead"><div><h2>五秒开头库</h2><div class="muted small">存放经过验证或值得测试的开场，不堆空洞金句</div></div></div><div class="card"><h3>新增开头</h3><div class="field"><label>开头文案 / 画面描述</label><textarea id="hText" placeholder="例如：先展示结果，再提出反常识问题……"></textarea></div><div class="grid cols"><div class="field"><label>适用场景</label><input id="hScene" placeholder="新品体验 / 配件对比 / 用户痛点"></div><div class="field"><label>验证状态</label><select id="hStatus"><option>待测试</option><option>已验证有效</option><option>效果一般</option></select></div></div><div class="field"><label>关联视频 / 数据 / 备注</label><input id="hNote"></div><button class="btn primary" id="saveHook">保存开头</button></div><div class="card"><h3>开头素材</h3><div id="hookList" class="list"></div></div>`;
 $('#saveHook').onclick=()=>{const text=$('#hText').value.trim();if(!text)return alert('先写开头内容');db.hooks.unshift({id:Date.now(),text,scene:$('#hScene').value,status:$('#hStatus').value,note:$('#hNote').value});save();renderHooks(root)};drawRecords('#hookList',db.hooks,'hooks');
}
function renderSop(root){
 root.innerHTML=`<div class="pagehead"><div><h2>SOP 库</h2><div class="muted small">沉淀能重复执行的流程，记录适用条件和验证结果</div></div></div><div class="card"><h3>新增 SOP</h3><div class="field"><label>名称</label><input id="sTitle" placeholder="例如：新机首发当天快速选题流程"></div><div class="grid cols"><div class="field"><label>所属环节</label><select id="sStage"><option>选题研究</option><option>脚本策划</option><option>拍摄</option><option>剪辑</option><option>发布复盘</option></select></div><div class="field"><label>验证状态</label><select id="sStatus"><option>待验证</option><option>已验证</option><option>需迭代</option></select></div></div><div class="field"><label>执行步骤</label><textarea id="sSteps" placeholder="1. …&#10;2. …&#10;3. …"></textarea></div><div class="field"><label>适用条件 / 案例 / 数据</label><textarea id="sEvidence"></textarea></div><button class="btn primary" id="saveSop">保存 SOP</button></div><div class="card"><h3>流程库</h3><div id="sopList" class="list"></div></div>`;
 $('#saveSop').onclick=()=>{const title=$('#sTitle').value.trim();if(!title)return alert('请填写 SOP 名称');db.sops.unshift({id:Date.now(),title,stage:$('#sStage').value,status:$('#sStatus').value,steps:$('#sSteps').value,evidence:$('#sEvidence').value});save();renderSop(root)};drawRecords('#sopList',db.sops,'sops');
}
function drawRecords(sel,arr,key){const el=$(sel);if(!el)return;el.innerHTML=arr.map(x=>{const title=x.title||x.text||x.url||'未命名记录',desc=x.steps||x.notes||x.evidence||x.note||x.goal||'';return `<div class="item"><div class="itemtop"><strong>${esc(title)}</strong><button class="btn danger" data-delete="${x.id}" data-key="${key}">删除</button></div><div><span class="tag">${esc(x.status||x.goal||'记录')}</span><span class="tag">${esc(x.stage||x.scene||x.date||'')}</span></div><p>${esc(desc)}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:''}</div>`}).join('')||'<div class="empty">暂无记录</div>';$$('[data-delete]',el).forEach(b=>b.onclick=()=>{db[b.dataset.key]=db[b.dataset.key].filter(x=>x.id!==+b.dataset.delete);save();drawRecords(sel,db[b.dataset.key],key)})}
function copyText(t){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(()=>alert('拆解指令已复制，可以粘贴给 AI。')).catch(()=>prompt('复制以下内容',t))}else prompt('复制以下内容',t)}
loadReport();
</script>
