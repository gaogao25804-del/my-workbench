<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图书馆 · Library</title>
<meta name="theme-color" content="#fdf2e9">
<link rel="stylesheet" href="assets/library.css?v=1">
</head>
<body class="lib-site">

<header class="lib-bar">
  <a class="lib-brand" href="./library.html">
    <span class="lib-mark">书</span>
    <span>
      <b>图书馆</b>
      <i>Library</i>
    </span>
  </a>
  <div class="lib-meta" id="libMeta">—</div>
  <label class="lib-search">
    <span class="lib-search-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
    </span>
    <input id="libSearch" type="search" placeholder="搜索书名 / 作者 / 书摘" autocomplete="off">
  </label>
</header>

<main class="lib-shell" id="libBody"></main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-head-main">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <div class="modal-tools">
        <button class="icon-btn" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="assets/library.js?v=1"></script>
</body>
</html>
