<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频库 · 作品/成片浏览</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b1120; }
  .scrollbar-x::-webkit-scrollbar { height: 6px; }
  .scrollbar-x::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .nav-link { padding: 6px 12px; border-radius: 8px; color: #cbd5e1; }
  .nav-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .nav-link.current { background: rgba(59,130,246,0.22); color: #93c5fd; }

  /* 视频卡片：玻璃态 + 悬浮 */
  .video-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .video-card:hover {
    transform: translateY(-2px);
    border-color: rgba(148,163,184,0.35);
    box-shadow: 0 20px 40px -30px rgba(59,130,246,0.5);
  }
  /* 视频盒子：先锁定 16:9 宽高比，再让 video 填充，避免留白过多 */
  .video-box {
    position: relative;
    aspect-ratio: 16 / 9;
    width: 100%;
    background: #000;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    display: block;
  }
  /* 当用户开始播放时，切换为 contain 让画面完整可见 */
  .video-box video.playing { object-fit: contain; background: #000; }
  .tag-cat {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid;
  }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<!-- ========== 顶部导航（三页通用结构） ========== -->
<nav class="sticky top-0 z-50 backdrop-blur-md bg-[#0b1120]/80 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
    <a href="index.html" class="font-bold text-white whitespace-nowrap text-lg tracking-wide flex items-center gap-2">
      <span class="inline-block w-2 h-6 bg-gradient-to-b from-amber-400 to-purple-500 rounded"></span>
      ARAM 英雄梯度
    </a>
    <div class="flex items-center gap-1 text-sm scrollbar-x overflow-x-auto flex-1 min-w-0">
      <a href="index.html"  class="nav-link whitespace-nowrap">🎮 梯度榜</a>
      <a href="wenan.html"  class="nav-link whitespace-nowrap">📝 文案库</a>
      <a href="shipin.html" class="nav-link whitespace-nowrap current">🎬 视频库</a>
    </div>
    <div class="text-xs text-slate-400 whitespace-nowrap">个人工作台</div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-8">

  <div class="mb-8">
    <h1 class="text-2xl md:text-3xl font-bold text-white mb-2">🎬 视频库</h1>
    <p class="text-sm text-slate-400">
      本地 <code class="text-sky-400">视频/</code> 文件夹中的成片（共 <span id="vCount" class="text-amber-300 font-semibold">—</span> 条）。
      点击 ▶ 开始播放；点击右下角放大按钮可全屏查看。
    </p>
  </div>

  <div id="vGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- JS 注入 -->
  </div>

  <div id="vEmpty" class="hidden text-center py-20 text-sm text-slate-500">视频文件夹为空，稍后再来看看~</div>

</main>

<footer class="border-t border-white/10 mt-16 py-6 text-center text-xs text-slate-500">
  视频作品仅本地预览 · 版权归作者所有
</footer>

<script>
/* ---------- 视频数据（来自 视频/ 文件夹） ---------- */
const VIDEOS = [
  {
    title: '金彪要周年 - 3',
    date:  '2026-08-18',
    size:  '420.2MB',
    path:  '视频/金彪要周年-3.mp4',
    cat:   '短片/生活',
    tag:   '周年纪念',
  },
  {
    title: '7.2 拍摄：36岁重启人生',
    date:  '2026-07-04',
    size:  '391.9MB',
    path:  '视频/7.2拍摄：36岁重启人生.mp4',
    cat:   'Vlog / 人文',
    tag:   '纪实 · 励志',
  },
  {
    title: '6.28 拍摄：理想 L8 · 大片 2（LIVIS 成片）',
    date:  '2026-07-02',
    size:  '718.4MB',
    path:  '视频/6.28拍摄：理想L8livis-大片2-成片成片2.mp4',
    cat:   '汽车 / 大片',
    tag:   '理想 · 航拍感剪辑',
  },
  {
    title: '6.28 拍摄：理想 L8 · 大片 1（特斯河之赞成片）',
    date:  '2026-07-03',
    size:  '271.3MB',
    path:  '视频/6.28拍摄：理想L8livis大片-1-特斯河之赞成片.mp4',
    cat:   '汽车 / 大片',
    tag:   '理想 · 旅行感剪辑',
  },
];

const CAT_STYLES = {
  '短片/生活':   'bg-rose-500/15   text-rose-300   border-rose-400/30',
  'Vlog / 人文': 'bg-amber-500/15  text-amber-300  border-amber-400/30',
  '汽车 / 大片': 'bg-sky-500/15    text-sky-300    border-sky-400/30',
};

function render(){
  document.getElementById('vCount').textContent = VIDEOS.length;
  if (!VIDEOS.length) { document.getElementById('vEmpty').classList.remove('hidden'); return; }

  const grid = document.getElementById('vGrid');
  grid.innerHTML = VIDEOS.map((v, i) => {
    const st = CAT_STYLES[v.cat] || 'bg-white/5 text-slate-300 border-white/20';
    const vidSrc = encodeURI(v.path);
    return `
    <article class="video-card rounded-2xl overflow-hidden">
      <div class="video-box">
        <video id="v_${i}" controls preload="metadata" playsinline
               poster="">
          <source src="${vidSrc}" type="video/mp4">
          您的浏览器不支持 HTML5 video，可<a href="${vidSrc}">点此直接下载观看</a>。
        </video>
      </div>
      <div class="p-5">
        <div class="flex items-start justify-between gap-3 mb-2">
          <h2 class="text-lg font-semibold text-white leading-snug">${v.title}</h2>
          <span class="tag-cat whitespace-nowrap ${st}">${v.cat}</span>
        </div>
        <div class="text-xs text-slate-400 mb-4"># ${v.tag}</div>
        <div class="flex items-center justify-between text-xs text-slate-500 pt-3 border-t border-white/5">
          <span>📅 ${v.date}</span>
          <div class="flex items-center gap-4">
            <span>📦 ${v.size}</span>
            <a href="${vidSrc}" download class="text-sky-400 hover:text-sky-300 inline-flex items-center gap-1">
              ⬇ 保存到本地
            </a>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');

  // 播放时切换 object-fit，避免画面被 crop
  VIDEOS.forEach((_, i) => {
    const v = document.getElementById('v_' + i);
    if (!v) return;
    v.addEventListener('play',  () => v.classList.add('playing'));
    v.addEventListener('pause', () => v.classList.remove('playing'));
  });
}

render();
</script>

</body>
</html>
