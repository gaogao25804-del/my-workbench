<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>内容策划 · 本月要交什么</title>
<link rel="stylesheet" href="../../assets/desk.css?v=1122a">
<link rel="stylesheet" href="../../assets/cards.css?v=1122a">
<link rel="stylesheet" href="../../assets/planner.css?v=1122a">
</head>
<body class="cd-page pl-page">

<div class="cd-bg" aria-hidden="true"><canvas></canvas></div>

<header class="cd-bar">
  <a class="cd-back" href="../../cards.html" title="回卡片库">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    卡片库
  </a>
  <b class="cd-title">内容策划</b>
  <span class="cd-sub">五个账号这个月要交的东西</span>
  <div class="grow"></div>
  <button class="dk-cloud" id="btnSync" type="button" title="同步：手机上打开就能看到同一份">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.4 18.4h9.9a3.6 3.6 0 0 0 .5-7.2 5.3 5.3 0 0 0-10.2-1.5 4.1 4.1 0 0 0-.2 8.7z"/>
    </svg>
    <i>只在本机</i>
  </button>
  <button class="cd-btn" id="btnTheme" type="button" title="切换深浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/>
    </svg>
  </button>
</header>

<main class="pl-wrap">

  <!-- 月份 + 三个数 -->
  <section class="pl-card pl-top">
    <div class="pl-month">
      <button class="pl-nav" type="button" id="plPrev" title="上个月" aria-label="上个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      </button>
      <b class="pl-ym" id="plYm">2026 年 11 月</b>
      <button class="pl-nav" type="button" id="plNext" title="下个月" aria-label="下个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
      </button>
      <label class="pl-pickwrap" title="直接选月份">
        <input class="pl-pick" id="plPick" type="month" aria-label="选择月份">
      </label>
      <button class="cd-btn" type="button" id="plToday">回到本月</button>
    </div>
    <div class="pl-stats" id="plStats">
      <div class="pl-stat"><b id="pTotal">0</b><span>本月计划</span></div>
      <div class="pl-stat is-doing"><b id="pDoing">0</b><span>正在推进</span></div>
      <div class="pl-stat is-done"><b id="pDone">0</b><span>已完成</span></div>
    </div>
  </section>

  <!-- 加一条 -->
  <section class="pl-card">
    <div class="pl-hd"><b>加一条</b><span>名称必填，其他都能空着，回车就加</span></div>
    <form class="pl-form" id="plForm" autocomplete="off">
      <input class="pl-in is-name" id="fName" type="text" placeholder="计划名称，比如：iPhone Duo 退货那条口播">
      <select class="pl-in" id="fAcct"></select>
      <input class="pl-in is-due" id="fDue" type="date" title="截止日期（不填就排在最后）">
      <input class="pl-in is-note" id="fNote" type="text" placeholder="备注（可不填）">
      <select class="pl-in is-st" id="fSt">
        <option value="todo">未开始</option>
        <option value="doing">进行中</option>
        <option value="done">已完成</option>
      </select>
      <button class="cd-btn pl-add" type="submit" id="plAdd">加进去</button>
    </form>
  </section>

  <!-- 列表 -->
  <section class="pl-card pl-listcard">
    <div class="pl-hd">
      <b>这个月的计划</b>
      <span id="plSorted">按截止日期排，没日期的垫底</span>
      <div class="grow"></div>
      <div class="pl-chips" id="plChips"></div>
    </div>
    <div class="pl-rows" id="plRows"></div>
  </section>

</main>

<div class="cd-toast" id="toast"></div>

<script src="../../assets/grid-bg.js?v=1122a"></script>
<script src="../../assets/sync.js?v=1122a"></script>
<script src="../../assets/planner.js?v=1122a"></script>
</body>
</html>
